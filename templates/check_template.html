<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чек {{invoice_id}}</title>
    <style>
        @page {
            size: A4;
            margin: 2cm;
        }
        body {
            font-family: 'DejaVu Sans', Arial, sans-serif;
            font-size: 12pt;
            line-height: 1.6;
            color: #333;
        }
        .header {
            text-align: center;
            border-bottom: 3px solid #4CAF50;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #4CAF50;
            margin: 0;
            font-size: 24pt;
        }
        .invoice-info {
            background-color: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .invoice-info p {
            margin: 5px 0;
        }
        .invoice-info strong {
            color: #4CAF50;
        }
        .details {
            margin: 30px 0;
        }
        .details table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .details th {
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            text-align: left;
        }
        .details td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        .total {
            text-align: right;
            margin-top: 20px;
            font-size: 16pt;
            font-weight: bold;
            color: #4CAF50;
        }
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid #ddd;
            text-align: center;
            color: #666;
            font-size: 10pt;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>ЧЕК</h1>
        <p>Номер: <strong>{{invoice_id}}</strong></p>
    </div>
    
    <div class="invoice-info">
        <p><strong>Дата:</strong> {{date}}</p>
        <p><strong>Клиент:</strong> {{customer_name}}</p>
        <p><strong>Адрес:</strong> {{address}}</p>
    </div>
    
    <div class="details">
        <h2>Детали заказа</h2>
        <table>
            <thead>
                <tr>
                    <th>Описание</th>
                    <th>Сумма</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>{{description}}</td>
                    <td>{{amount}} ₽</td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <div class="total">
        Итого: {{amount}} ₽
    </div>
    
    <div class="footer">
        <p>Спасибо за ваш заказ!</p>
        <p>Это автоматически сгенерированный документ</p>
    </div>
</body>
</html>
